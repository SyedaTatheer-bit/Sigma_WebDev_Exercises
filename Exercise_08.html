<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball animation</title>
    <style>
        .bg{
            background-color:rgb(233, 233, 48);
            width: 70vw;
            height: 40vw;
            position:fixed;
        }
        .ball{
            height:50px;
            width: 50px;
            background-color: green;
            border: 2px solid black;
            border-radius: 50%;
            position: absolute;
            bottom:0;
            left:0; 
            animation: bounceX 3s linear 0.5s infinite , bounceY 1s ease-out 0.5s infinite alternate ;
        }
        @keyframes bounceX{
            from{
                left:0;

            }
            to{
                left:100%;
                
            }
            
        }
        @keyframes bounceY {
            from{
                bottom:0;
            }
            to{
                bottom:100%
            }
            
        }


    </style>
</head>
<body>
    <div class="bg">
        <div class="ball"></div>
    </div>
    
    
</body>
</html>
